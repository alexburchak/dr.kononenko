# Часті запитання. ЗАМІНИТИ відповіді на справжні.
- question: Чи боляче?
  answer: Більшість процедур безболісні або викликають легкий дискомфорт. Для ін'єкційних методик використовується знеболювальний крем.
- question: Скільки процедур потрібно?
  answer: Залежить від стану шкіри та мети. Точну кількість лікар визначає на консультації — зазвичай це курс із 3–6 процедур.
- question: Які протипоказання?
  answer: Вагітність і годування груддю (для частини процедур), гострі запалення, герпес у період загострення, деякі хронічні захворювання. Повний перелік обговорюється на консультації.
- question: Як підготуватися до процедури?
  answer: За 1–2 тижні до пілінгів уникайте засмаги та агресивних засобів. Детальні рекомендації ви отримаєте під час запису.
- question: Чи можна одразу прийти на процедуру без консультації?
  answer: На доглядові процедури — так. На пілінги, ін'єкційні методики та лікування акне — лише після консультації лікаря.
- question: Як записатися?
  answer: Напишіть у Telegram, Viber або Instagram чи зателефонуйте. Прийом лише за попереднім записом.

# Відгуки. Публікуйте лише з дозволу клієнта. Усі нижче — приклади, ЗАМІНИТИ.
- name: Анна
  source: Instagram
  text: Нарешті лікар, який пояснив, звідки в мене висипання, а не просто продав процедуру. За три місяці шкіра стала чистою.
- name: Ірина
  source: Google
  text: Дуже уважний підхід, усе стерильно й акуратно. Після пілінгу отримала докладну пам'ятку з догляду.
- name: Марія
  source: Instagram
  text: Ходжу на біоревіталізацію вже рік. Результат природний, ніхто не здогадується, просто «гарно виглядаєш».
- name: Олена
  source: Google
  text: Записалася з пігментацією, яку роками не могла прибрати. Лікар чесно сказала, чого чекати, і результат перевершив очікування.
- name: Катерина
  source: Instagram
  text: Затишний кабінет, приємна атмосфера, жодного нав'язування зайвих послуг.

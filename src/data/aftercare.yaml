# Пам'ятки після процедур — лікар може надіслати клієнту посилання. ЗАМІНИТИ тексти.
- slug: pislia-pilingu
  title: Після пілінгу
  rules:
    - Не торкайтеся обличчя руками перший день.
    - Не використовуйте скраби, кислоти та ретиноїди 7 днів.
    - Щодня наносьте сонцезахисний крем SPF 50, навіть у похмуру погоду.
    - Не відвідуйте сауну, басейн і солярій 7 днів.
    - Лущення — нормальна реакція. Не здирайте лусочки.
  warning: Якщо з'явилися сильне печіння, набряк або пухирі — одразу напишіть лікарю.
- slug: pislia-chystky
  title: Після чистки обличчя
  rules:
    - Не наносьте декоративну косметику 12 годин.
    - Умивайтеся м'яким засобом, без скрабів 3 дні.
    - Не засмагайте 3–5 днів.
  warning: Почервоніння проходить протягом доби. Якщо ні — напишіть лікарю.
- slug: pislia-inyektsii
  title: Після ін'єкційних процедур
  rules:
    - Не торкайтеся місць ін'єкцій і не робіть масаж обличчя 2 доби.
    - Не наносьте косметику 12 годин.
    - Уникайте сауни, спорту та алкоголю 2 доби.
    - Невеликі папули та синці проходять за 2–5 днів.
  warning: Якщо набряк посилюється, з'явився біль або зміна кольору шкіри — негайно зв'яжіться з лікарем.

# Розділ «Про лікаря»
about:
  intro: >-
    Я лікар-дерматолог, хірург-дерматолог, трихолог і косметолог. Моя мета — здорова шкіра, а не лише швидкий
    ефект. Тому кожна робота починається з консультації: ми з'ясовуємо причину проблеми,
    і лише потім я пропоную лікування чи процедури.
  education:
    - year: "1999–2005"
      text: "Луганський державний медичний університет, спеціальність «Педіатрія»"
    - year: "2005–2007"
      text: "Інтернатура за спеціальністю «Педіатрія» Дніпропетровська медична академія МОЗ України"
    - year: "2020"
      text: "Спеціалізація «Дерматовенерологія» Дніпропетровська медична академія МОЗ України"
    - year: "2024"
      text: "«Хірургічна дерматологія» Запорізький державний медико-фармацевтичний університет"
    - year: "2016"
      text: "«Практична косметологія» Дніпропетровський медичний інститут традиційної і нетрадиційної медицини"
  
